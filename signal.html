<!doctype html>
<html lang="ru" data-deck="external">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal — QA Platform</title>
  <meta name="description" content="Иммерсивная презентация QA Platform: колбэки и моки в одном сервисе — сигнальная магистраль и слайды по спирали вокруг неё.">
  <!-- Стили слайдов — общие с 3d.html; signal/style.css — сцена поверх них -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="3d/deck.css">
  <link rel="stylesheet" href="signal/style.css">
</head>
<body>
  <!-- Запуск системы: этапы старта отмечаются по факту (signal/loader.js) -->
  <div class="boot" id="boot" role="status" aria-live="polite" aria-label="Загрузка презентации">
    <div class="boot__grid" aria-hidden="true"></div>
    <div class="boot__marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="boot__tate" lang="ja" aria-hidden="true">信号幹線<span>第一系統</span></p>
    <div class="boot__panel">
      <p class="boot__kicker"><span lang="ja">起動シーケンス</span><span>System boot</span></p>
      <div class="boot__mark"></div>
      <div class="boot__title">
        <b>QA Platform</b>
        <span lang="ja">品質保証基盤</span>
      </div>
      <ol class="boot__steps"></ol>
      <p class="boot__status"><span class="boot__status-text">Подготовка…</span><span class="boot__count"></span></p>
      <button type="button" class="boot__retry" hidden>Повторить загрузку</button>
    </div>
    <span class="boot__seal" lang="ja" aria-hidden="true">品質</span>
  </div>

  <canvas class="scene" id="scene" aria-hidden="true"></canvas>

  <!-- Карточки: слайды из 3d.html, спроецированные в сцену (signal/css3d.js) -->
  <main class="deck3d" id="cards"></main>

  <!-- Рамка кадра: метки по углам и вертикальная подпись — как поля чертежа -->
  <div class="frame" aria-hidden="true">
    <i class="frame__mark frame__mark--tl"></i><i class="frame__mark frame__mark--tr"></i>
    <i class="frame__mark frame__mark--bl"></i><i class="frame__mark frame__mark--br"></i>
    <p class="frame__tate" lang="ja">品質保証基盤<span id="frameChapter">序章</span></p>
  </div>

  <header class="nav">
    <a class="nav__brand" href="#" id="toStart"><span class="nav__seal" lang="ja" aria-hidden="true">品</span>QA Platform<span class="nav__sub">signal</span></a>
    <!-- Переключатель глав: предыдущая — текущая — следующая -->
    <div class="switch" id="switch">
      <button type="button" class="switch__btn" id="switchPrev" aria-label="Предыдущая глава">&lt;&lt;</button>
      <span class="switch__name" id="switchName" aria-live="polite"></span>
      <button type="button" class="switch__btn" id="switchNext" aria-label="Следующая глава">&gt;&gt;</button>
    </div>
  </header>

  <!-- Шкала прогресса по главам у правого края -->
  <div class="rail" aria-hidden="true"><i class="rail__thumb" id="railThumb"></i></div>

  <!-- Подпись справа внизу — на всю презентацию; над ней счётчик слайдов -->
  <section class="intro" aria-label="QA Platform">
    <p class="counter" aria-live="polite"><span id="counterNum">00</span><span class="counter__total"></span></p>
    <h1 class="intro__title">QA Platform</h1>
  </section>

  <nav class="menu" aria-label="Главы">
    <p class="menu__title">Куда смотрим?</p>
    <ol class="menu__list" id="menuList"></ol>
  </nav>

  <!-- Подпись главы: японский код → глитч → русское название; при посадке
       переезжает в шапку (signal/title.js). Для экранных читалок глава
       объявляется переключателем (#switchName, aria-live) -->
  <p class="chapter-title" id="chapterTitle" aria-hidden="true"></p>

  <p class="overview-hint" id="overviewHint">Обзор: стрелки выбирают главу, Enter открывает, Esc возвращает</p>

  <noscript><p class="noscript">Сцене нужен JavaScript и WebGL.</p></noscript>
  <script type="module" src="signal/app.js"></script>
</body>
</html>
